name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron is only needed for desktop builds; do not download it in CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: toolkit
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            toolkit/package-lock.json
            toolkit/mcp/package-lock.json

      - name: Install from lockfile
        run: npm ci

      # The MCP server (toolkit/mcp) has its own package so its SDK never ships in the
      # desktop installer; install it so its tests run instead of being skipped.
      - name: Install MCP server from lockfile
        working-directory: toolkit/mcp
        run: npm ci

      - name: Verify installed tree matches the lockfile
        run: npm ls --omit=dev

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Audit MCP server dependencies
        if: runner.os == 'Linux'
        working-directory: toolkit/mcp
        run: npm audit --omit=dev --audit-level=high

      - name: Licence report
        if: runner.os == 'Linux'
        run: npm run licenses

      - name: Upload licence report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: toolkit/license-report.md
          if-no-files-found: warn
          retention-days: 90

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
