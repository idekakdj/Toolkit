<!DOCTYPE html>
<html lang="en" data-shell="1">
<head>
  <script src="/js/frame-escape.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Toolkit</title>
  <link rel="icon" href="/img/toolkit.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/home.css">
  <script type="module" src="/js/home.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <button type="button" class="home-btn is-active" id="home-btn" aria-label="Toolkit home" aria-current="page">
      <img src="/img/toolkit.svg" alt="" width="20" height="20">
      <span class="home-label">Toolkit</span>
    </button>
    <div class="tab-strip" id="tab-strip" role="tablist" aria-label="Open tabs"></div>
    <button type="button" class="icon-btn new-tab-btn" id="new-tab-btn" aria-label="New tab (go to Home)" title="New tab">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-spacer"></div>
    <div class="user-menu" id="user-menu">
      <button type="button" class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="user-pop">
        <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
        <span class="user-name" id="user-name"></span>
        <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="user-pop" id="user-pop" role="menu" aria-label="Account menu" hidden>
        <a role="menuitem" class="menu-item" href="/account" target="_top">Account</a>
        <button type="button" role="menuitem" class="menu-item" id="signout-btn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="content" id="content">
    <section class="home-view" id="home-view" aria-label="Toolkit home" tabindex="-1">
      <div class="home-inner">
        <h1 class="greeting" id="greeting">Welcome back</h1>
        <p class="greeting-sub">Pick up where you left off, or start something new.</p>
        <div id="sections"></div>
      </div>
    </section>
    <div class="frames" id="frames"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Toolkit needs JavaScript to run.</p></noscript>
</body>
</html>
